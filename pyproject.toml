[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "peccancy-partner-sdk"
version = "0.1.0"
description = "Official Peccancy partner SDK — create disputes, take payments and verify result webhooks."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["peccancy", "disputes", "betting", "partner", "sdk"]
authors = [{ name = "Peccancy" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/peccancy/partner-sdk-python"

[tool.setuptools.packages.find]
where = ["src"]
